<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Katsuya | Japanese Cutlets &amp; Sushi Rolls</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --side-w: 112px;
            --top-h: 0px;
            --red: #c63227;
            --lacquer: #7a1710;
            --box-red: #8b1e16;
            --paper: #ece6d8;
            --cream: #f7f2e8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #000;
            color: var(--cream);
            font-family: "Lora", Georgia, serif;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--side-w);
            background: #000;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 8px 40px;
        }

        .rbar {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: var(--side-w);
            background: #000;
            z-index: 30;
        }

        .dock {
            width: 64px;
            height: 64px;
        }

        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        .links a {
            color: var(--cream);
            text-decoration: none;
            font-size: 1rem;
            padding: 2px 0;
            border-bottom: 1px solid transparent;
            transition: color .2s, border-color .2s;
        }

        .links a:hover {
            border-bottom-color: var(--cream);
        }

        .links a.active {
            color: var(--red);
            border-bottom-color: var(--red);
        }

        .links a:focus-visible {
            outline: 2px solid var(--cream);
            outline-offset: 3px;
        }

        .logo {
            position: fixed;
            z-index: 40;
            display: block;
            max-width: none;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .journey {
            position: relative;
            height: 300svh;
            background: #000;
        }

        .stage {
            position: sticky;
            top: 0;
            height: 100svh;
            overflow: hidden;
            background: #000;
        }

        .photo-wrap {
            position: absolute;
            top: var(--top-h);
            bottom: 0;
            left: var(--side-w);
            right: var(--side-w);
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 100%, transparent 38%, rgba(60, 45, 20, .35) 39% 43%, transparent 44%) 0 0 / 56px 28px,
                #b79a6e;
        }

        .photo-wrap img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .cover {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: #000;
            transform: translateY(100%);
            will-change: transform;
        }

        .cover::before {
            content: "";
            position: absolute;
            bottom: calc(100% - 2px);
            left: 0;
            width: 100%;
            height: clamp(120px, 18vw, 240px);
            background-image: linear-gradient(to bottom, transparent 45%, #000 100%), url("wave.png");
            background-size: 100% 100%, 100% auto;
            background-position: center bottom;
            background-repeat: no-repeat;
            pointer-events: none;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 45%);
            mask-image: linear-gradient(to bottom, transparent 0%, #000 45%);
            opacity: var(--wave-opacity, 0);
        }

        .arrow {
            position: absolute;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            background: none;
            border: 0;
            color: var(--cream);
            cursor: pointer;
            z-index: 3;
            animation: bob 1.8s ease-in-out infinite;
        }

        .arrow svg {
            width: 34px;
            height: 34px;
            display: block;
            filter: drop-shadow(0 1px 4px rgba(0, 0, 0, .6));
        }

        .arrow:focus-visible {
            outline: 2px solid var(--red);
            outline-offset: 4px;
        }

        @keyframes bob {

            0%,
            100% {
                transform: translate(-50%, 0);
            }

            50% {
                transform: translate(-50%, 8px);
            }
        }

        .caption {
            position: absolute;
            left: var(--side-w);
            right: var(--side-w);
            text-align: center;
            font-size: clamp(18px, 2.2vw, 28px);
            font-weight: 400;
            opacity: 0;
            z-index: 4;
        }

        .main-pad {
            padding-left: var(--side-w);
            padding-right: var(--side-w);
        }

        .bento-track {
            position: relative;
            min-height: 100svh;
            background: #000;
        }

        .bento-stage {
            position: sticky;
            top: 0;
            height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1.5rem;
        }

        .bento-box {
            width: min(1040px, 100%);
            height: min(80svh, 660px);
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 12px;
            padding: 12px;
            background: var(--box-red);
            border-radius: 14px;
            outline: 2px solid #000;
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .compartment {
            position: relative;
            border-radius: 8px;
            background: #151515;
            min-height: 0;
        }

        .compartment.shot {
            flex: 1;
            overflow: hidden;
            background: #1c1c1c;
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity .6s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
            font-size: .8rem;
            text-align: center;
            padding: .5rem;
        }

        .slide.on {
            opacity: 1;
        }

        .slide img,
        .slide video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .compartment.top {
            flex: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
        }

        .compartment.items {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 6px 14px;
            background: var(--paper);
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .tab {
            background: transparent;
            color: var(--cream);
            border: 1px solid rgba(247, 242, 232, .28);
            border-radius: 6px;
            height: 44px;
            font: inherit;
            font-size: .95rem;
            letter-spacing: .04em;
            cursor: pointer;
            transition: background .2s, color .2s, border-color .2s;
        }

        .tab:hover {
            border-color: rgba(247, 242, 232, .65);
        }

        .tab[aria-selected="true"] {
            background: var(--cream);
            color: #1a1a1a;
            border-color: var(--cream);
        }

        .tab:focus-visible {
            outline: 2px solid var(--cream);
            outline-offset: 2px;
        }

        .included {
            padding: .8rem .2rem 0;
            border-top: 1px solid rgba(247, 242, 232, .16);
            font-size: .8rem;
            line-height: 1.5;
            color: #cfc7b8;
            height: 6em;
            overflow: hidden;
        }

        .listwrap {
            position: relative;
            flex: 1;
            min-height: 0;
        }

        .list {
            position: absolute;
            inset: 0;
            overflow: hidden;
            padding-right: 14px;
            display: flex;
            flex-direction: column;
            visibility: hidden;
        }

        .list.on {
            visibility: visible;
        }

        .rail {
            position: absolute;
            top: 6px;
            right: 0;
            bottom: 6px;
            width: 3px;
            border-radius: 2px;
            background: rgba(0, 0, 0, .1);
            z-index: 1;
        }

        .rail i {
            position: absolute;
            left: 0;
            right: 0;
            border-radius: 2px;
            background: var(--lacquer);
        }

        .slot {
            perspective: 1000px;
            flex: none;
            height: 68px;
            background: none;
            border: 0;
            padding: 0;
            cursor: pointer;
            color: #1a1a1a;
            font: inherit;
            text-align: left;
        }

        .slot.plain {
            cursor: default;
        }

        .slot:focus-visible {
            outline: 2px solid var(--lacquer);
            outline-offset: -2px;
        }

        .slot-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform .7s cubic-bezier(.4, .2, .2, 1);
        }

        .slot.flipped .slot-inner {
            transform: rotateX(180deg);
        }

        .face {
            position: absolute;
            inset: 0;
            background: var(--paper);
            border-bottom: 1px solid rgba(0, 0, 0, .16);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0 .3rem;
        }

        .face.back {
            transform: rotateX(180deg);
            background: #e2d9c6;
        }

        .name {
            font-size: 1.05rem;
            letter-spacing: .02em;
        }

        .price {
            font-weight: 500;
            white-space: nowrap;
            color: var(--lacquer);
        }

        .desc {
            font-size: .84rem;
            line-height: 1.4;
        }

        .desc em {
            color: var(--lacquer);
        }

        .section {
            min-height: 100svh;
            padding-top: 6rem;
            padding-bottom: 4rem;
            text-align: center;
            background: #000;
        }

        .section h2 {
            font-weight: 500;
            font-size: 2.2rem;
            margin-bottom: 2rem;
        }

        .frame {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background: #1c1c1c;
            height: 400px;
        }

        .frame::before {
            content: attr(data-media);
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: .8rem;
        }

        .frame img,
        .frame video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .about {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: min(960px, 100%);
            margin: 0 auto;
        }

        .about figure {
            text-align: left;
        }

        .about figcaption {
            margin-top: .8rem;
            line-height: 1.5;
            color: #ccc;
            font-size: .95rem;
        }

        .pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 2.5rem;
        }

        .pills a {
            color: var(--cream);
            text-decoration: none;
            border: 1px solid rgba(247, 242, 232, .35);
            border-radius: 6px;
            padding: .75rem 1.4rem;
            font-size: .95rem;
            letter-spacing: .03em;
            transition: background .2s, color .2s, border-color .2s;
        }

        .pills a:hover,
        .pills a:focus-visible {
            background: var(--cream);
            color: #1a1a1a;
            border-color: var(--cream);
            outline: none;
        }

        .visit-photos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: min(960px, 100%);
            margin: 0 auto;
        }

        .visit-info {
            margin: 2.5rem auto 0;
            line-height: 1.7;
        }

        .visit-info address {
            font-style: normal;
            margin-bottom: 1rem;
        }

        .visit-info p {
            margin: 0 0 1rem;
            color: #ccc;
        }

        .visit-info a {
            color: var(--cream);
            text-underline-offset: 4px;
        }

        .banner,
        .cal {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            padding: .7rem 1rem;
            font-family: system-ui, sans-serif;
            font-size: .9rem;
            display: none;
        }

        .banner {
            background: #b00020;
            color: #fff;
        }

        .cal {
            background: #111;
            color: #fff;
            bottom: 48px;
        }

        @media (max-width: 800px) {
            :root {
                --side-w: 0px;
                --top-h: 64px;
            }

            .rbar {
                display: none;
            }

            .sidebar {
                bottom: auto;
                right: 0;
                width: 100%;
                height: 64px;
                flex-direction: row;
                padding: 0 12px;
            }

            .dock {
                width: 44px;
                height: 44px;
            }

            .links {
                flex-direction: row;
                gap: 14px;
            }

            .links a {
                font-size: .85rem;
            }

            .bento-stage {
                padding: 72px 1rem 1rem;
                align-items: stretch;
            }

            .bento-box {
                grid-template-columns: 1fr;
                grid-template-rows: 90px 1fr;
                height: 100%;
            }

            .col.left {
                flex-direction: row;
            }

            .tab {
                height: 38px;
                font-size: .8rem;
            }

            .included {
                font-size: .7rem;
                height: 5em;
            }

            .section {
                padding-top: 7rem;
                padding-left: 1rem;
                padding-right: 1rem;
            }

            .about,
            .visit-photos {
                grid-template-columns: 1fr;
            }

            .frame {
                height: 300px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .arrow {
                animation: none;
            }

            .slot-inner,
            .slide {
                transition: none;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar" aria-label="Main navigation">
        <div class="dock" id="dock"></div>
        <nav class="links">
            <a href="#home" data-go="home">Home</a>
            <a href="#lid" data-go="lid">Menu</a>
            <a href="#about" data-go="about">About Us</a>
            <a href="#location" data-go="location">Location</a>
        </nav>
    </aside>
    <div class="rbar" aria-hidden="true"></div>

    <img class="logo" id="logo" alt="Katsuya">

    <main>
        <div class="journey" id="home">
            <div class="stage" id="stage">
                <div class="photo-wrap" id="wrap">
                    <img id="photo" alt="Katsuya restaurant interior">
                </div>
                <div class="cover" id="cover" aria-hidden="true"></div>
                <button class="arrow" id="arrow" aria-label="Scroll down">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="4 8 12 16 20 8" />
                    </svg>
                </button>
                <p class="caption" id="caption">Open your bento box!</p>
            </div>
        </div>

        <section class="bento-track main-pad" id="bento" aria-label="Menu">
            <div class="bento-stage">
                <div class="bento-box">
                    <div class="col left" id="shots"></div>
                    <div class="col right">
                        <div class="compartment top">
                            <div class="tabs" id="tabs" role="tablist" aria-label="Menu sections"></div>
                            <p class="included" id="included"></p>
                        </div>
                        <div class="compartment items">
                            <div class="listwrap" id="listwrap">
                                <div class="rail" aria-hidden="true"><i id="thumb"></i></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="section main-pad" id="about">
            <h2>About Us</h2>
            <div class="about">
                <figure>
                    <div class="frame" data-media="bts.mov" data-alt="Making fresh panko"></div>
                    <figcaption>Making fresh panko</figcaption>
                </figure>
                <figure>
                    <div class="frame" data-media="owners.jpg" data-alt="Co-owners Jack Li and Dae “Teddy” Lee"></div>
                    <figcaption>Co-owners Jack Li and Dae “Teddy” Lee</figcaption>
                </figure>
            </div>
            <div class="pills">
                <a href="https://www.yelp.com/biz/katsuya-stl-university-city" target="_blank" rel="noopener">Katsuya on
                    Yelp</a>
                <a href="https://www.instagram.com/katsuyastl/" target="_blank" rel="noopener">@katsuyastl on
                    Instagram</a>
            </div>
        </section>

        <section class="section main-pad" id="location">
            <h2>Visit Katsuya</h2>
            <div class="visit-photos">
                <div class="frame" data-media="inside.jpg" data-alt="Inside Katsuya"></div>
                <div class="frame" data-media="outside.jpg" data-alt="Outside Katsuya"></div>
            </div>
            <div class="visit-info">
                <address>6301 Delmar Blvd<br>St. Louis, MO 63130</address>
                <p>Sunday–Saturday<br>11am–8pm</p>
                <p><a href="tel:+13142963368">(314) 296-3368</a></p>
            </div>
        </section>
    </main>

    <div class="banner" id="banner"></div>
    <div class="cal" id="cal"></div>

                    ['Single Veggie Roll', '$8', 'Cucumber, avocado, and mixed vegetables rolled with rice and seaweed paper.'],
                    ['Single King Kong Roll', '$11', 'Deep-fried roll with two tempura shrimp, tuna, cucumber, avocado, and imitation crab meat. Topped with eel sauce and spicy mayo.'],
                    ['Salmon Nigiri (6)', '$12', 'Six pieces. Slices of salmon placed on top of sushi rice.'],
                    ['Shrimp Nigiri (6)', '$12'],
                    ['Salmon/Shrimp Nigiri (6)', '$12.50', 'Three salmon nigiri and three shrimp nigiri.'],
                    ['Single Salmon/Avocado Roll', '$8']
                ]
            },
            {
                title: 'Side Dishes',
                media: ['side.jpg', 'side2.jpg'],
                note: 'Soup, salads, and small plates.',
                items: [
                    ['Miso Soup', '$2.50'],
                    ['Rice', '$2.50'],
                    ['Egg Roll (2)', '$6'],
                    ['Vegetable Egg Roll (2)', '$6'],
                    ['Crab Rangoon (5)', '$6.50'],
                    ['Gyoza (6)', '$6.50'],
                    ['Curry Sauce', '$3.50'],
                    ['Katsuya Salad', '$3.50', 'House salad served with ginger dressing.'],
                    ['Seaweed Salad', '$5.50'],
                    ['Takoyaki (6)', '$6.50', 'Six ball-shaped Japanese snacks made with wheat-based batter and filled with minced octopus.'],
                    ['House Kimchi', '$3'],
                    ['Potato Korokke (2)', '$6', 'Two mashed potato croquettes coated with panko breadcrumbs and deep-fried.', veg]
                ]
            }
        ];

        const stage = document.getElementById('stage');
        const wrap = document.getElementById('wrap');
        const photo = document.getElementById('photo');
        const cover = document.getElementById('cover');
        const logo = document.getElementById('logo');
        const dock = document.getElementById('dock');
        const caption = document.getElementById('caption');
        const arrow = document.getElementById('arrow');
        const track = document.getElementById('bento');
        const about = document.getElementById('about');
        const locationSection = document.getElementById('location');
        const banner = document.getElementById('banner');
        const cal = document.getElementById('cal');
        const tabs = document.getElementById('tabs');
        const included = document.getElementById('included');
        const listwrap = document.getElementById('listwrap');
        const thumb = document.getElementById('thumb');
        const shots = document.getElementById('shots');
        const links = [...document.querySelectorAll('.links a')];

        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const smooth = t => t * t * (3 - 2 * t);
        const lists = [];
        const slides = MENU.map(() => []);
        let overflow = 0;
        let trackTop = 0;
        let current = 0;
        let calibrating = false;
        let queued = false;

        function showError(text) {
            banner.style.display = 'block';
            banner.textContent = banner.textContent ? banner.textContent + ' ' + text : text;
        }

        function loadFirst(el, names, onFail) {
            let i = 0;
            el.addEventListener('error', () => {
                i += 1;
                if (i < names.length) el.src = names[i];
                else onFail();
            });
            el.addEventListener('load', request);
            el.src = names[0];
        }

        function mediaEl(file, alt) {
            const base = file.slice(0, file.lastIndexOf('.'));
            const isVideo = /\.(mov|mp4|webm|m4v)$/i.test(file);
            const exts = isVideo ? ['.mp4', '.mov', '.webm'] : ['.jpg', '.jpeg', '.png', '.webp'];
            const names = [file, ...exts.map(e => base + e)].filter((n, i, a) => a.indexOf(n) === i);
            let el;
            if (isVideo) {
                el = document.createElement('video');
                el.muted = true;
                el.loop = true;
                el.playsInline = true;
                el.preload = 'auto';
                el.setAttribute('muted', '');
                el.setAttribute('playsinline', '');
                el.setAttribute('aria-label', alt);
            } else {
                el = document.createElement('img');
                el.alt = alt;
            }
            loadFirst(el, names, () => { el.style.display = 'none'; });
            return el;
        }

        function buildMenu() {
            for (let k = 0; k < 2; k++) {
                const shot = document.createElement('div');
                shot.className = 'compartment shot';
                MENU.forEach((cat, ci) => {
                    const slide = document.createElement('div');
                    slide.className = 'slide';
                    slide.textContent = cat.media[k];
                    const el = mediaEl(cat.media[k], cat.title);
                    if (el.tagName === 'VIDEO') {
                        el.addEventListener('canplay', () => {
                            if (slide.classList.contains('on')) el.play().catch(() => { });
                        });
                    }
                    slide.append(el);
                    shot.append(slide);
                    slides[ci].push(slide);
                });
                shots.append(shot);
            }

            MENU.forEach((cat, ci) => {
                const tab = document.createElement('button');
                tab.type = 'button';
                tab.className = 'tab';
                tab.setAttribute('role', 'tab');
                tab.textContent = cat.title;
                tab.addEventListener('click', () => chooseCategory(ci));
                tabs.append(tab);

                const list = document.createElement('div');
                list.className = 'list';
                cat.items.forEach(([name, price, desc, tag]) => {
                    const nameEl = document.createElement('span');
                    nameEl.className = 'name';
                    nameEl.textContent = name;
                    const priceEl = document.createElement('span');
                    priceEl.className = 'price';
                    priceEl.textContent = price;
                    const front = document.createElement('div');
                    front.className = 'face';
                    front.append(nameEl, priceEl);
                    const inner = document.createElement('div');
                    inner.className = 'slot-inner';
                    inner.append(front);

                    let slot;
                    if (desc) {
                        const back = document.createElement('div');
                        back.className = 'face back';
                        const text = document.createElement('span');
                        text.className = 'desc';
                        text.textContent = desc + ' ';
                        if (tag) {
                            const em = document.createElement('em');
                            em.textContent = tag;
                            text.append(em);
                        }
                        back.append(text);
                        inner.append(back);
                        slot = document.createElement('button');
                        slot.type = 'button';
                        slot.className = 'slot';
                        slot.setAttribute('aria-pressed', 'false');
                        slot.addEventListener('click', () => {
                            const on = slot.classList.toggle('flipped');
                            slot.setAttribute('aria-pressed', on);
                        });
                    } else {
                        slot = document.createElement('div');
                        slot.className = 'slot plain';
                    }
                    slot.append(inner);
                    list.append(slot);
                });
                listwrap.append(list);
                lists.push(list);
            });
        }

        function buildFrames() {
            const io = new IntersectionObserver(entries => {
                entries.forEach(en => {
                    if (en.isIntersecting) en.target.play().catch(() => { });
                    else en.target.pause();
                });
            }, { threshold: 0.25 });

            document.querySelectorAll('.frame[data-media]').forEach(frame => {
                const el = mediaEl(frame.dataset.media, frame.dataset.alt || '');
                frame.append(el);
                if (el.tagName === 'VIDEO') io.observe(el);
            });
        }

        function setCategory(idx) {
            current = idx;
            [...tabs.children].forEach((t, i) => t.setAttribute('aria-selected', i === idx));
            lists.forEach((l, i) => l.classList.toggle('on', i === idx));
            slides.forEach((group, ci) => group.forEach(slide => {
                slide.classList.toggle('on', ci === idx);
                const v = slide.querySelector('video');
                if (v) {
                    if (ci === idx) v.play().catch(() => { });
                    else v.pause();
                }
            }));
            included.textContent = MENU[idx].note;
            lists[idx].scrollTop = 0;
        }

        function chooseCategory(idx) {
            if (idx === current) return;
            setCategory(idx);
            measure();
            if (window.scrollY > trackTop) window.scrollTo({ top: trackTop, behavior: 'auto' });
        }

        function measure() {
            const H = window.innerHeight;
            track.style.height = '';
            trackTop = track.getBoundingClientRect().top + window.scrollY;
            const list = lists[current];
            overflow = Math.max(0, list.scrollHeight - list.clientHeight);
            track.style.height = `${H * 1.5 + overflow}px`;
            request();
        }

        function update() {
            queued = false;
            const H = stage.clientHeight;
            const s = window.scrollY;

            const areaW = wrap.clientWidth;
            const areaH = wrap.clientHeight;
            const areaL = wrap.offsetLeft;
            const areaT = wrap.offsetTop;

            const pw = photo.naturalWidth || FALLBACK.w;
            const ph = photo.naturalHeight || FALLBACK.h;
            const scale = Math.max(areaW / pw, areaH / ph);
            const offX = (areaW - pw * scale) / 2;
            const offY = (areaH - ph * scale) / 2;

            const startX = areaL + offX + LOGO.x * pw * scale;
            const startY = areaT + offY + LOGO.y * ph * scale;
            const logoW = LOGO.w * pw * scale;
            const ratio = (logo.naturalHeight && logo.naturalWidth) ? logo.naturalHeight / logo.naturalWidth : 1;

            const midX = areaL + areaW / 2;
            const midY = areaT + areaH / 2;

            const progress = clamp(s / H, 0, 1);
            const settle = smooth(clamp((progress - 0.85) / 0.15, 0, 1));
            const shrink = smooth(clamp((s - H * 1.5) / (H * 0.5), 0, 1));

            cover.style.transform = `translateY(${(1 - progress) * 100}%)`;
            cover.style.setProperty('--wave-opacity', Math.min(1, progress / 0.12));

            const d = dock.getBoundingClientRect();
            const dockX = d.left + d.width / 2;
            const dockY = d.top + d.height / 2;
            const dockW = d.width;

            let cx = startX + (midX - startX) * settle;
            let cy = startY + (midY - startY) * settle;
            let w = logoW;

            if (shrink > 0) {
                cx = midX + (dockX - midX) * shrink;
                cy = midY + (dockY - midY) * shrink;
                w = logoW + (dockW - logoW) * shrink;
            }

            logo.style.width = `${w}px`;
            logo.style.left = `${cx}px`;
            logo.style.top = `${cy}px`;
            logo.style.pointerEvents = shrink > 0.95 ? 'auto' : 'none';
            logo.style.cursor = shrink > 0.95 ? 'pointer' : 'default';

            caption.style.top = `${midY + (logoW * ratio) / 2 + 24}px`;
            caption.style.opacity = clamp((progress - 0.9) / 0.1, 0, 1) * (1 - shrink);

            arrow.style.opacity = 1 - shrink;
            arrow.style.pointerEvents = shrink > 0.5 ? 'none' : 'auto';

            const pos = clamp(s - trackTop - H * 0.25, 0, overflow);
            const list = lists[current];
            list.scrollTop = pos;
            const frac = Math.min(1, list.clientHeight / (list.scrollHeight || 1));
            const room = listwrap.clientHeight * (1 - frac);
            thumb.style.height = `${frac * 100}%`;
            thumb.style.top = `${overflow ? (pos / overflow) * room : 0}px`;

            let active = 'home';
            if (s >= H * 0.5) active = 'lid';
            if (s >= locationSection.offsetTop - H * 0.5) active = 'location';
            else if (s >= about.offsetTop - H * 0.5) active = 'about';
            links.forEach(a => a.classList.toggle('active', a.dataset.go === active));
        }

        function request() {
            if (!queued) {
                queued = true;
                requestAnimationFrame(update);
            }
        }

        function goTo(name) {
            const H = window.innerHeight;
            let top = 0;
            if (name === 'lid') top = H * 1.25;
            if (name === 'about') top = about.offsetTop;
            if (name === 'location') top = locationSection.offsetTop;
            window.scrollTo({ top, behavior: 'smooth' });
        }

        function showCal() {
            cal.style.display = 'block';
            cal.textContent = `Calibrating (arrows move, [ and ] resize, C to finish): const LOGO = { x: ${LOGO.x.toFixed(4)}, y: ${LOGO.y.toFixed(4)}, w: ${LOGO.w.toFixed(4)} };`;
        }

        window.addEventListener('keydown', e => {
            if (e.key === 'c' || e.key === 'C') {
                calibrating = !calibrating;
                if (calibrating) { window.scrollTo({ top: 0, behavior: 'auto' }); showCal(); }
                else cal.style.display = 'none';
                return;
            }
            if (!calibrating) return;
            const step = 0.002;
            const moves = { ArrowLeft: ['x', -step], ArrowRight: ['x', step], ArrowUp: ['y', -step], ArrowDown: ['y', step], '[': ['w', -step], ']': ['w', step] };
            const m = moves[e.key];
            if (!m) return;
            e.preventDefault();
            LOGO[m[0]] += m[1];
            showCal();
            request();
        });

        links.forEach(link => {
            link.addEventListener('click', e => {
                e.preventDefault();
                goTo(link.dataset.go);
            });
        });
        logo.addEventListener('click', () => goTo('home'));
        arrow.addEventListener('click', () => {
            if (window.scrollY < window.innerHeight * 1.25) goTo('lid');
            else window.scrollTo({ top: trackTop, behavior: 'smooth' });
        });

        window.addEventListener('scroll', request, { passive: true });
        window.addEventListener('resize', measure);
        window.addEventListener('load', measure);
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);

        buildMenu();
        buildFrames();
        setCategory(0);

        loadFirst(photo, ['homepage.png', 'Homepage.png', 'homepage.jpg', 'homepage.jpeg', 'homepage.webp'], () => {
            photo.style.display = 'none';
            showError('homepage.png was not found next to this file, so a placeholder wallpaper is showing.');
        });
        loadFirst(logo, ['Logo.png', 'logo.png', 'katsuya.png', 'logo.svg'], () => {
            logo.src = FALLBACK_LOGO;
            showError('Logo.png was not found next to this file, so a drawn logo is showing.');
        });

        measure();
    </script>
</body>
